# Local stack: Neo4j Community + the app.
# Ollama runs on the host (ollama serve) and is reached via host.docker.internal.
services:
  neo4j:
    image: neo4j:5-community
    container_name: kg-neo4j
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-kgstudio123}
      - NEO4J_server_memory_heap_max__size=1G
    ports:
      - "7474:7474"   # browser: http://localhost:7474
      - "7687:7687"   # bolt
    volumes:
      - kg-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-kgstudio123} 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  app:
    build: .
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - KG_GRAPH_BACKEND=neo4j
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-kgstudio123}
      - KG_EMBEDDING_BACKEND=local
      - KG_ANSWER_LLM=auto
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - KG_STATE_DIR=/data/state
    ports:
      - "8000:8000"
    volumes:
      - kg-app-state:/data/state
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  kg-neo4j-data:
  kg-app-state:
